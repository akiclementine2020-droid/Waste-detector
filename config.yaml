## Troubleshooting Guide
TROUBLESHOOTING:
  GPU_OUT_OF_MEMORY:
    - "Reduce batch size (--batch 8)"
    - "Reduce image size (--imgsz 416)"
    - "Use smaller model (yolov8s.pt)"
    - "Use CPU only (--device -1)"
  
  POOR_ACCURACY:
    - "Check dataset quality and labels"
    - "Increase training epochs"
    - "Use larger model size"
    - "Verify data augmentation settings"
  
  SLOW_TRAINING:
    - "Use GPU instead of CPU"
    - "Use smaller model"
    - "Reduce image size"
    - "Increase batch size (if GPU memory allows)"
  
  MODEL_NOT_LOADING:
    - "Train the model first: python train.py"
    - "Verify model path exists"
    - "Check file permissions"
    - "Ensure correct weights file"
