# Waste Detection System Configuration

## Training Configuration
TRAINING_CONFIG:
  # Model selection
  MODEL_SIZE: "yolov8m"  # Options: yolov8n, yolov8s, yolov8m, yolov8l, yolov8x
  
  # Training hyperparameters
  EPOCHS: 100
  BATCH_SIZE: 16
  IMAGE_SIZE: 640
  PATIENCE: 20  # Early stopping patience
  
  # Optimizer settings
  LEARNING_RATE: 0.01
  MOMENTUM: 0.937
  WEIGHT_DECAY: 0.0005
  
  # Data augmentation
  AUGMENTATION:
    ROTATION: 10  # degrees
    SCALE: 0.5
    TRANSLATE: 0.1
    FLIPLR: 0.5
    FLIPUD: 0.5
    HSV_H: 0.015
    HSV_S: 0.7
    HSV_V: 0.4
    MOSAIC: 1.0
  
  # Device
  DEVICE: 0  # GPU device ID (0 for first GPU, -1 for CPU)
  
  # Output
  OUTPUT_DIR: "models"


## Inference Configuration
INFERENCE_CONFIG:
  # Model path
  MODEL_PATH: "models/waste_detector/weights/best.pt"
  
  # Inference settings
  CONFIDENCE_THRESHOLD: 0.5
  IOU_THRESHOLD: 0.45
  MAX_DETECTIONS: 300
  
  # Performance
  BATCH_SIZE: 1
  DEVICE: 0  # Same GPU device as training


## Web Interface Configuration
INTERFACE_CONFIG:
  # Server settings
  SERVER_NAME: "0.0.0.0"
  SERVER_PORT: 7860
  SHARE: true
  VERBOSE: true
  
  # Interface theme
  THEME: "soft"
  
  # Confidence slider
  CONFIDENCE_MIN: 0.0
  CONFIDENCE_MAX: 1.0
  CONFIDENCE_DEFAULT: 0.5
  CONFIDENCE_STEP: 0.05


## Waste Classes
WASTE_CLASSES:
  0: "bottle"
  1: "cardboard"
  2: "metal"
  3: "organic"
  4: "paper"
  5: "plastic"

CLASS_COLORS:
  bottle: [255, 0, 0]        # Blue
  cardboard: [0, 165, 255]   # Orange
  metal: [192, 192, 192]     # Gray
  organic: [34, 139, 34]     # Green
  paper: [255, 255, 0]       # Cyan
  plastic: [128, 0, 128]     # Purple


## System Requirements
REQUIREMENTS:
  PYTHON_MIN: "3.8"
  PYTORCH_VERSION: "2.0.0"
  CUDA_MIN: "11.8"
  RAM_MIN: 8  # GB
  GPU_MEMORY_MIN: 4  # GB
  STORAGE_MIN: 5  # GB


